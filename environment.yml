name: insite
channels:
  - pytorch
  - conda-forge
  - nodefaults
dependencies:
  # Only direct project dependencies are listed here. Conda resolves their
  # transitive and platform-specific dependencies for the target system.
  - python=3.9
  - biopython=1.78
  - numpy=1.26
  - openbabel=3.1.1
  - pandas=2.1
  - pip
  - pytorch=2.5.1
  - rdkit=2023.09
  - scikit-learn=1.6
  - tqdm=4.67
  - pip:
      - torch-cluster==1.6.3
      - torch-geometric==2.6.1
      - torch-scatter==2.1.2
      - wandb==0.25.0
